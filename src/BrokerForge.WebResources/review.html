<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BrokerForge review</title>
<style>
  :root { --text: #1b1b1b; --muted: #5c5c5c; --line: #d6d6d6; --bad: #a4262c; --good: #107c10; --accent: #0f6cbd; }
  body { font: 14px/1.45 "Segoe UI", system-ui, sans-serif; color: var(--text); margin: 0; padding: 12px 16px; background: #fff; }
  h2 { font-size: 16px; margin: 18px 0 6px; }
  .muted { color: var(--muted); }
  .bad { color: var(--bad); }
  .good { color: var(--good); }
  table { border-collapse: collapse; width: 100%; margin: 4px 0 8px; }
  th, td { text-align: left; border-bottom: 1px solid var(--line); padding: 4px 6px; vertical-align: top; }
  input[type=text], input[type=number], select { width: 100%; box-sizing: border-box; font: inherit; }
  .question { margin: 4px 0 4px 24px; }
  .question label { display: block; }
  .bar { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0; }
  button { font: inherit; padding: 4px 12px; }
  button.primary { background: var(--accent); color: #fff; border: 1px solid var(--accent); }
  button:disabled { opacity: .5; }
  ul { margin: 4px 0; padding-left: 20px; }
</style>
</head>
<body>
<div id="message" class="muted">Loading…</div>
<div id="page" hidden>
  <div class="bar">
    <button id="read" class="primary">Save and read the definition</button>
    <button id="saveAnswers">Save answers and check</button>
  </div>
  <div id="problems"></div>
  <h2>Table</h2>
  <div id="table"></div>
  <h2>Endpoints</h2>
  <div id="endpoints"></div>
  <h2>This environment</h2>
  <div id="environment"></div>
  <h2>Generate</h2>
  <div id="preview"></div>
  <div class="bar"><button id="generate" class="primary" disabled>Generate</button></div>
  <div id="status"></div>
  <div id="done"></div>
</div>
<script src="review-model.js"></script>
<script src="review.js"></script>
</body>
</html>
