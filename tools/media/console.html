<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BrokerForge</title>
<!-- The admin scenes: an editor over a terminal. record.mjs drives it through window.ui; every file and every command
     output shown here was captured from a real run by capture.mjs. -->
<style>
  :root { --bg: #1e1e1e; --panel: #252526; --tab: #2d2d2d; --line: #858585; --text: #d4d4d4; --key: #9cdcfe; --str: #ce9178;
          --num: #b5cea8; --com: #6a9955; --hl: rgba(255, 213, 0, 0.16); --ok: #4ec9b0; --err: #f48771; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 15px/1.5 Menlo, Consolas, monospace; overflow: hidden; }
  #app { display: grid; grid-template-rows: 34px 1fr 6px 330px; height: 100%; }
  #tabs { background: var(--tab); display: flex; align-items: stretch; font-family: -apple-system, "Segoe UI", sans-serif; font-size: 13px; }
  #tabs div { padding: 8px 18px; color: #999; border-right: 1px solid #1e1e1e; }
  #tabs div.on { background: var(--bg); color: #fff; border-top: 2px solid #0078d4; }
  #editor { overflow: hidden; padding: 10px 0; position: relative; }
  #editor .row { display: flex; white-space: pre; transition: background 300ms; }
  #editor .row.hl { background: var(--hl); }
  #editor .n { width: 56px; text-align: right; padding-right: 18px; color: var(--line); flex: none; }
  #editor .empty { color: #777; font-family: -apple-system, "Segoe UI", sans-serif; padding: 40px; }
  #split { background: #333; }
  #terminal { background: #181818; padding: 10px 18px; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; }
  #terminal .title { position: absolute; }
  #term { white-space: pre-wrap; word-break: break-word; }
  .prompt { color: var(--ok); }
  .k { color: var(--key); } .s { color: var(--str); } .v { color: var(--num); } .c { color: var(--com); } .h { color: #569cd6; font-weight: bold; }
  .err { color: var(--err); } .ok { color: var(--ok); }
  .cursor { display: inline-block; width: 9px; height: 17px; background: #ccc; vertical-align: -3px; animation: blink 1s step-end infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  #termbar { font-family: -apple-system, "Segoe UI", sans-serif; font-size: 12px; color: #aaa; text-transform: uppercase; letter-spacing: .06em; margin-bottom: 6px; }
</style>
</head>
<body data-dark="1">
<div id="app">
  <div id="tabs"></div>
  <div id="editor"><div class="empty">No file open</div></div>
  <div id="split"></div>
  <div id="terminal"><div id="termbar">Terminal</div><div id="term"></div></div>
</div>
<script>
  const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  function colour(line, kind) {
    if (kind === 'md') {
      if (/^#/.test(line)) return `<span class="h">${esc(line)}</span>`;
      return esc(line).replace(/`([^`]+)`/g, '<span class="s">`$1`</span>');
    }
    // YAML and Bicep, enough to read.
    const m = /^(\s*)(- )?([A-Za-z_$@][\w.$@-]*)(:)(.*)$/.exec(line);
    if (/^\s*(#|\/\/)/.test(line)) return `<span class="c">${esc(line)}</span>`;
    if (m) return `${m[1]}${m[2] ?? ''}<span class="k">${esc(m[3])}</span>${m[4]}${value(m[5])}`;
    return value(line);
  }
  function value(v) {
    return esc(v).replace(/("[^"]*"|'[^']*')/g, '<span class="s">$1</span>').replace(/(?<![\w-])(\d+(\.\d+)?|true|false)(?![\w-])/g, '<span class="v">$1</span>');
  }
  let file = null;
  const ui = {
    open(name, text, { kind = 'yaml', top = 1 } = {}) {
      document.getElementById('tabs').innerHTML = `<div class="on">${esc(name)}</div>`;
      file = { name, kind, lines: text.replace(/\n$/, '').split('\n'), top };
      ui.render();
    },
    render(highlight = []) {
      const ed = document.getElementById('editor');
      ed.innerHTML = file.lines.slice(file.top - 1).map((l, i) => {
        const n = i + file.top;
        return `<div class="row${highlight.includes(n) ? ' hl' : ''}" data-n="${n}"><span class="n">${n}</span><span>${colour(l, file.kind) || ' '}</span></div>`;
      }).join('');
    },
    highlight(from, to = from) { const h = []; for (let i = from; i <= to; i++) h.push(i); ui.render(h); },
    /** Scrolls so that line n is at the top. */
    scroll(n) { file.top = Math.max(1, n); ui.render(); },
    lineOf(text) { return file.lines.findIndex(l => l.includes(text)) + 1; },
    async edit(n, from, to) {
      const before = file.lines[n - 1];
      const at = before.indexOf(from);
      // Backspace over the old text, then type the new.
      for (let k = from.length; k >= 0; k--) { file.lines[n - 1] = before.slice(0, at) + from.slice(0, k) + before.slice(at + from.length); ui.highlight(n); await sleep(40); }
      for (let k = 1; k <= to.length; k++) { file.lines[n - 1] = before.slice(0, at) + to.slice(0, k) + before.slice(at + from.length); ui.highlight(n); await sleep(70); }
    },
    async run(command, output) {
      const term = document.getElementById('term');
      const line = document.createElement('div');
      line.innerHTML = '<span class="prompt">$ </span><span class="cmd"></span><span class="cursor"></span>';
      term.appendChild(line);
      const cmd = line.querySelector('.cmd');
      for (const ch of command) { cmd.textContent += ch; await sleep(28); }
      line.querySelector('.cursor').remove();
      await sleep(500);
      for (const l of output.replace(/\n$/, '').split('\n')) {
        const o = document.createElement('div');
        o.className = /error|refus|Exception|HTTP 4/.test(l) ? 'err' : /valid$|nothing to change|planned|drafted,/.test(l) ? 'ok' : '';
        o.textContent = l;
        term.appendChild(o);
        await sleep(90);
      }
      while (term.children.length > 30) term.firstChild.remove();
    },
    clear() { document.getElementById('term').innerHTML = ''; },
  };
  window.ui = ui;
</script>
</body>
</html>
